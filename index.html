<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1.0 caps iOS Safari's auto-zoom-on-input-focus at 100%
         (it can't zoom past the viewport's max), so the page no longer jumps
         in and stays zoomed after tapping a form field. Pinch-zoom out is
         still available; this only stops the unwanted zoom-in. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="description" content="RotaCat — Smart ED scheduling, made effortless" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RotaCat" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts: Figtree (primary UI) + Manrope (its fallback) + JetBrains
         Mono (data/codes) + Fraunces (serif, the RotaCat wordmark only).
         Exactly the four the app references — see tailwind.config.js's
         fontFamily. This used to load every family ever trialled (Satoshi,
         Inter, Lexend, Public Sans, Archivo, Plus Jakarta Sans, Onest) so
         that swapping the primary was a one-line change here; Figtree is
         settled now, and eight unused families at four weights each is real
         weight to pull down on hospital wifi. Trying another candidate
         means adding it back to this URL as well as to the config. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&display=swap"
      rel="stylesheet"
    />

    <title>RotaCat — Smart ED scheduling, made effortless</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
